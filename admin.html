<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Dashboard | VoterSpheres</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      padding: 40px;
    }

    h1 {
      margin-bottom: 20px;
    }

    .card {
      background: #fff;
      padding: 20px;
      max-width: 500px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input, button {
      width: 100%;
      margin-top: 8px;
      padding: 10px;
      font-size: 16px;
    }

    button {
      background: #0057ff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background: #003fc7;
    }

    .status {
      margin-top: 15px;
      font-weight: bold;
    }

    img {
      margin-top: 15px;
      max-width: 100%;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <h1>Admin Dashboard</h1>

  <div class="card">
    <h2>Upload Candidate Photo</h2>

    <label>Candidate ID</label>
    <input type="number" id="candidateId" placeholder="Enter candidate ID" />

    <label>Photo (JPG / PNG)</label>
    <input type="file" id="photoFile" accept="image/*" />

    <button onclick="uploadCandidatePhoto()">Upload Photo</button>

    <div id="uploadStatus" class="status"></div>
    <img id="previewImage" style="display:none;" />
  </div>

  <script src="index.js"></script>
</body>
</html>
