<!DOCTYPE html>
<html>
<head>
<title>Admin Panel</title>
<style>
body{font-family:Arial;background:#f4f6fb;padding:20px}
table{width:100%;background:white;border-collapse:collapse}
td,th{border:1px solid #ddd;padding:6px}
</style>
</head>
<body>

<h2>Admin Users</h2>

<table>
<thead>
<tr>
<th>ID</th><th>Email</th><th>Role</th><th>Active</th><th>Actions</th>
</tr>
</thead>
<tbody id="users"></tbody>
</table>

<script>

const API="http://localhost:10000";
const token=localStorage.getItem("token");

fetch(API+"/api/admin/users",{
 headers:{Authorization:"Bearer "+token}
})
.then(r=>r.json())
.then(d=>{
 users.innerHTML="";
 d.forEach(u=>{
   users.innerHTML+=`
    <tr>
     <td>${u.id}</td>
     <td>${u.email}</td>
     <td>${u.role}</td>
     <td>${u.active}</td>
     <td>
       <button onclick="disable(${u.id})">Disable</button>
       <button onclick="del(${u.id})">Delete</button>
     </td>
    </tr>`;
 });
});

function disable(id){
 fetch(API+"/api/admin/users/"+id+"/disable",{
   method:"PUT",
   headers:{Authorization:"Bearer "+token}
 }).then(()=>location.reload());
}

function del(id){
 fetch(API+"/api/admin/users/"+id,{
   method:"DELETE",
   headers:{Authorization:"Bearer "+token}
 }).then(()=>location.reload());
}
<h3>Upload Candidate Photo</h3>

<input type="file" id="photoFile">
<button onclick="uploadPhoto()">Upload</button>

<script>
async function uploadPhoto() {
  const file = document.getElementById("photoFile").files[0];

  const form = new FormData();
  form.append("photo", file);

  const id = prompt("Candidate ID:");

  await fetch(`http://localhost:10000/api/candidates/${id}/photo`, {
    method: "POST",
    body: form
  });

  alert("Uploaded!");
}
</script>

</script>
</body>
</html>
