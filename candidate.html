<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Candidate Profile</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" id="metaDesc" content="" />
</head>
<body>

  <h1 id="name"></h1>
  <p id="details"></p>

  <script>
    const params = new URLSearchParams(window.location.search);
    const slug = params.get("slug");
    const id = slug.split("-").pop();

    fetch(`http://localhost:10000/api/candidates/${id}`)
      .then(r => r.json())
      .then(c => {
        document.title = `${c.full_name} | Candidate Profile`;
        document.getElementById("metaDesc").content =
          `${c.full_name} running for ${c.office}`;

        document.getElementById("name").textContent = c.full_name;
        document.getElementById("details").textContent =
          `${c.party} – ${c.state}`;
      });
  </script>

</body>
</html>
