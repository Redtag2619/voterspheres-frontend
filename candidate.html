<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title id="title">Candidate</title>
  <meta name="description" id="metaDesc" content="" />
</head>
<body>

<h1 id="name"></h1>
<p id="info"></p>

<script>
  const slug = window.location.pathname.split("/").pop();
  const id = slug.split("-").pop();

  fetch(`/api/candidates/${id}`)
    .then(r => r.json())
    .then(c => {
      document.title = `${c.full_name} | ${c.office}`;
      document.getElementById("metaDesc").content =
        `${c.full_name}, ${c.party} candidate for ${c.office} in ${c.state}`;

      document.getElementById("name").textContent = c.full_name;
      document.getElementById("info").textContent =
        `${c.party} · ${c.state} · ${c.office}`;
    });
</script>

</body>
</html>
