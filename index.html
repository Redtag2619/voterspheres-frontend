<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>VoterSpheres</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f6f7fb;
      margin: 0;
      padding: 0;
    }

    header {
      background: #1e3a8a;
      color: white;
      padding: 16px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }

    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 20px;
    }

    .filters {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    input, select {
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      min-width: 200px;
      font-size: 14px;
    }

    #results {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 15px;
    }

    .card {
      background: white;
      padding: 14px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,.08);
      font-size: 14px;
    }

    .card strong {
      font-size: 16px;
      color: #1e3a8a;
    }

    #pagination {
      margin-top: 25px;
      text-align: center;
    }

    #pagination button {
      margin: 4px;
      padding: 8px 12px;
      border-radius: 6px;
      border: none;
      background: #1e3a8a;
      color: white;
      cursor: pointer;
    }

    #pagination button:disabled {
      background: #94a3b8;
      cursor: default;
    }

    footer {
      margin-top: 40px;
      text-align: center;
      color: #555;
      font-size: 13px;
    }
  </style>
</head>

<body>

<header>
  VoterSpheres – Political Directory
</header>

<div class="container">

  <div class="filters">
    <input 
      id="searchInput" 
      type="text" 
      placeholder="Search candidates by name..." 
    />

    <select id="candidateSelect"></select>
  </div>

  <div id="results"></div>

  <div id="pagination"></div>

</div>

<footer>
  © 2026 VoterSpheres | Data for public political offices
</footer>

<script type="module" src="/src/main.ts"></script>

</body>
</html>
