<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VoterSpheres Login</title>
<style>
body {
  font-family: Arial, sans-serif;
  background:#f3f6fb;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.container{
  background:white;
  padding:30px;
  width:350px;
  border-radius:10px;
  box-shadow:0 10px 25px rgba(0,0,0,.1);
}

h2{
  text-align:center;
  margin-bottom:15px;
}

input{
  width:100%;
  padding:10px;
  margin:8px 0;
  border:1px solid #ccc;
  border-radius:6px;
}

button{
  width:100%;
  padding:10px;
  background:#2563eb;
  color:white;
  border:none;
  border-radius:6px;
  cursor:pointer;
  margin-top:8px;
}

button:hover{
  background:#1e4ed8;
}

.switch{
  text-align:center;
  margin-top:12px;
  color:#2563eb;
  cursor:pointer;
}

.message{
  text-align:center;
  margin-top:10px;
}

.success{ color:green; }
.error{ color:red; }
</style>
</head>

<body>

<div class="container">

<h2 id="title">Login</h2>

<input id="email" placeholder="Email" type="email">
<input id="password" placeholder="Password" type="password">

<button onclick="submitForm()">Login</button>

<div class="switch" onclick="toggleMode()">
Create account instead
</div>

<div class="message" id="message"></div>

</div>

<script>

const API = "http://localhost:10000/api/auth";

let isLogin = true;

function toggleMode(){
  isLogin = !isLogin;

  document.getElementById("title").innerText = isLogin ? "Login" : "Register";
  document.querySelector("button").innerText = isLogin ? "Login" : "Register";
  document.querySelector(".switch").innerText = 
    isLogin ? "Create account instead" : "Already have an account?";
  
  document.getElementById("message").innerText = "";
}

async function submitForm(){

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const message = document.getElementById("message");

  message.innerText = "";
  message.className = "message";

  if(!email || !password){
    showError("Fill all fields");
    return;
  }

  const url = isLogin ? "/login" : "/register";

  try{
    const res = await fetch(API + url, {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ email, password })
    });

    const data = await res.json();

    if(!res.ok){
      showError(data.error || "Error");
      return;
    }

    if(isLogin){
      localStorage.setItem("token", data.token);
      showSuccess("Logged in successfully!");
      
      setTimeout(()=>{
        window.location.href = "dashboard.html"; // optional
      },1000);
    } else {
      showSuccess("Account created! Now login.");
      toggleMode();
    }

  }catch(err){
    showError("Server not responding");
  }
}

function showError(text){
  const m = document.getElementById("message");
  m.innerText = text;
  m.className = "message error";
}

function showSuccess(text){
  const m = document.getElementById("message");
  m.innerText = text;
  m.className = "message success";
}

</script>

</body>
</html>
