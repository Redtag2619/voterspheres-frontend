<!DOCTYPE html>
<html>
<head>
  <title>Candidate Profile</title>
  <style>
    body { font-family: Arial; padding:20px }
    img {
      width:200px;
      height:auto;
      border-radius:8px;
      margin-bottom:15px;
    }
  </style>
</head>
<body>

<a href="index.html">← Back</a>

<h1 id="name"></h1>

<img id="photo" style="display:none"/>

<p><strong>Email:</strong> <span id="email"></span></p>
<p><strong>Phone:</strong> <span id="phone"></span></p>
<p><strong>Website:</strong> <a id="website" target="_blank"></a></p>

<script>
const API = "http://localhost:10000";

const id = new URLSearchParams(window.location.search).get("id");

async function loadProfile() {
  const res = await fetch(`${API}/api/candidates/${id}`);
  const c = await res.json();

  document.getElementById("name").innerText = c.full_name;
  document.getElementById("email").innerText = c.email || "";
  document.getElementById("phone").innerText = c.phone || "";

  if (c.website) {
    document.getElementById("website").innerText = c.website;
    document.getElementById("website").href = c.website;
  }

  if (c.photo) {
    const img = document.getElementById("photo");
    img.src = `${API}/uploads/${c.photo}`;
    img.style.display = "block";
  }
}

loadProfile();
</script>

</body>
</html>
