<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title id="seo-title">Candidate Profile</title>
  <meta id="seo-description" name="description" content="" />

  <meta name="robots" content="index, follow" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Canonical -->
  <link id="canonical" rel="canonical" href="" />

  <!-- Open Graph -->
  <meta id="og-title" property="og:title" content="" />
  <meta id="og-description" property="og:description" content="" />
  <meta property="og:type" content="profile" />

  <!-- JSON-LD injected by JS -->
</head>
<body>

  <a href="/">← Back</a>

  <h1 id="name"></h1>
  <img id="photo" width="220" style="display:none;" />

  <p><strong>Office:</strong> <span id="office"></span></p>
  <p><strong>State:</strong> <span id="state"></span></p>
  <p><strong>Party:</strong> <span id="party"></span></p>
  <p><strong>County:</strong> <span id="county"></span></p>

  <hr />

  <div id="admin">
    <h3>Admin Photo Upload</h3>
    <input type="file" id="photoInput" />
    <button onclick="uploadPhoto()">Upload</button>
  </div>

  <script src="index.js"></script>
</body>
</html>
