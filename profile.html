<!DOCTYPE html>
<html>
<head>
  <title>Candidate Profile</title>
  <style>
    body { font-family: Arial; padding:20px }
  </style>
</head>
<body>

<a href="index.html">← Back</a>

<h1 id="name"></h1>

<p><strong>Office:</strong> <span id="office"></span></p>
<p><strong>State:</strong> <span id="state"></span></p>
<p><strong>County:</strong> <span id="county"></span></p>
<p><strong>Party:</strong> <span id="party"></span></p>

<p><strong>Email:</strong> <span id="email"></span></p>
<p><strong>Phone:</strong> <span id="phone"></span></p>
<p><strong>Website:</strong> <a id="website" target="_blank"></a></p>

<script>
const API = "http://localhost:10000";

const params = new URLSearchParams(window.location.search);
const id = params.get("id");

async function loadProfile() {
  const res = await fetch(`${API}/api/candidates/${id}`);
  const c = await res.json();

  document.getElementById("name").innerText = c.full_name;
  document.getElementById("office").innerText = c.office_name || "";
  document.getElementById("state").innerText = c.state_name || "";
  document.getElementById("county").innerText = c.county_name || "";
  document.getElementById("party").innerText = c.party_name || "";

  document.getElementById("email").innerText = c.email || "";
  document.getElementById("phone").innerText = c.phone || "";

  if (c.website) {
    document.getElementById("website").innerText = c.website;
    document.getElementById("website").href = c.website;
  }
}

loadProfile();
</script>

</body>
</html>
